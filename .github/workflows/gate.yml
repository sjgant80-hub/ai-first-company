name: gate

# Every sealed claim re-measured on a clean machine, and every kernel mutation-tested (nothing baselined).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    name: unit suites + every seal + every receipt re-measured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # each seal is checked against its sealing commit; step 1 re-grades with the conductor at its own commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: unit suites
        run: node --test test/*.test.mjs skills/*/tests/*.test.mjs
      - name: seals unchanged, receipts re-measured
        run: |
          for s in step1 step1b step3 step4; do node tools/$s-measure.mjs --check; node tools/$s-measure.mjs --verify; done
          for s in step5 step6 step7; do if [ -f tools/$s-measure.mjs ]; then node tools/$s-measure.mjs --check; node tools/$s-measure.mjs --verify; fi; done
      - name: the bot team — every seal unchanged, every receipt re-measured (step 2 with roster.mjs at its own commit)
        run: |
          node tools/team1-measure.mjs --check && node tools/team1-measure.mjs --verify
          node tools/team2-measure.mjs --check && node tools/team2-measure.mjs --verify
          node tools/team2b-measure.mjs --check && node tools/team2b-measure.mjs --verify
          if [ -f data/team3-auditor-run.json ]; then node tools/team3-measure.mjs --check && node tools/team3-measure.mjs --verify; fi
          # step 4 touches the team's private shared repo: CI checks its seal and that its receipt adds up
          node tools/team4-measure.mjs --check
          if [ -f data/team4-wire-run.json ]; then node tools/team4-measure.mjs --verify; fi
          # step 6: the skill library's index is the folders' own, and its receipt re-measures
          node tools/skills.mjs --check
          node tools/team6-measure.mjs --check
          if [ -f data/team6-skills-run.json ]; then node tools/team6-measure.mjs --verify; fi
          # growth organs step 1: the gated-experiment seal is unchanged and its receipt re-measures
          node tools/growth1-measure.mjs --check && node tools/growth1-measure.mjs --verify
          # mint-a-department step 1: the baseline-agreement seal is unchanged and its receipt re-measures
          node tools/mint1-measure.mjs --check && node tools/mint1-measure.mjs --verify
          # mint-a-department step 2: the three teacher-distillation runs (two kept nulls, one positive) — each seal and
          # pinned public dataset unchanged, each receipt re-derived from the teacher reply recorded once (no model call)
          for t in mint-demo mint-demo-v2 mint-demo-v3; do node tools/$t.mjs --check && node tools/$t.mjs --verify; done
          # the mutation gate's counts the page shows: whole, clean, and read from a CI run's own log
          node tools/kernel-witness.mjs --check
      - name: every offer link the funnel drafts into a reply is alive (a renamed repo once broke one)
        run: |
          node --input-type=module -e "
          import { OFFERS } from './src/funnel.mjs';
          let bad = 0;
          for (const o of OFFERS) { const r = await fetch(o.url, { redirect: 'follow' }); console.log(r.status, o.url); if (r.status !== 200) bad++; }
          process.exit(bad ? 1 : 0);"

  witness:
    name: mutation gate (witness v0.6, pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-first-company
      - name: clone the witness gate, pinned to v0.6 (every kernel is gated by the same tagged release)
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git witness-v0.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: witness the company loop's kernels (refuse anything short of clean; nothing baselined)
        working-directory: ai-first-company
        run: |
          gate6() { node ../witness-v0.6/witness.mjs mutate "src/$1.mjs" --cap 1000 --timeout 120000 --test node --test "test/$1.test.mjs" | tee "$1.out"; grep -q '"clean": true' "$1.out" || { echo "::error::mutants survived in src/$1.mjs"; exit 1; }; }
          for k in conductor brief reach journal funnel ops oversight cycle costcase page; do gate6 $k; done
      - name: witness the bot team's, the growth gate's and the guarantee's kernels (refuse anything short of clean)
        working-directory: ai-first-company
        run: |
          gate6() { node ../witness-v0.6/witness.mjs mutate "src/$1.mjs" --cap 1000 --timeout 120000 --test node --test "test/$1.test.mjs" | tee "$1.out"; grep -q '"clean": true' "$1.out" || { echo "::error::mutants survived in src/$1.mjs"; exit 1; }; }
          for k in feed rollup roster cards auditor skills experiment baseline distill; do gate6 $k; done
